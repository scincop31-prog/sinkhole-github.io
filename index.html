<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울 지반침하 우선조사 지도 | Google Maps</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,'Malgun Gothic',sans-serif}
#map{height:100%;width:100%}
#panel{position:absolute;z-index:2;top:12px;left:12px;background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 12px #0003;max-width:310px;font-size:13px}
#panel h3{margin:0 0 8px;font-size:17px}label{display:block;margin:7px 0}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px}
#status{font-size:12px;color:#444;margin-top:8px}
.note{color:#666;font-size:11px;line-height:1.5}
</style></head><body>
<div id="map"></div>
<div id="panel"><h3>서울 지반침하 위험순위</h3>
<label><input type="checkbox" id="risk" checked> 위험 상위 10% 격자</label>
<label><input type="checkbox" id="priority" checked> 우선조사 후보 (초록 점)</label>
<label><input type="checkbox" id="accident" checked> 2025년 사고 좌표 (검은 점)</label>
<div style="margin:10px 0">
<div><span class="sw" style="background:#b71c1c"></span>상위 1%</div>
<div><span class="sw" style="background:#ef5350"></span>상위 1~3%</div>
<div><span class="sw" style="background:#fb8c00"></span>상위 3~5%</div>
<div><span class="sw" style="background:#fdd835"></span>상위 5~10%</div>
</div><div id="status">지도 및 분석자료 로딩 중...</div>
<p class="note">탐색적 상대 위험순위. 실제 사고 확률·피해 예상이 아님. 도로시설 면적비율 기준 순위 재구성(동점 처리 시 종전 지도와 일부 다를 수 있음). 서울시·통계청 SGIS·국토교통부 등 원자료 활용.</p>
</div>
<script>
const colors={'상위 1%':'#b71c1c','상위 1~3%':'#ef5350','상위 3~5%':'#fb8c00','상위 5~10%':'#fdd835'};
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function initMap(){
  const map=new google.maps.Map(document.getElementById('map'),{center:{lat:37.5665,lng:126.978},zoom:11,mapTypeId:'roadmap',mapTypeControl:true});
  const info=new google.maps.InfoWindow();
  const layers={
    risk:new google.maps.Data({map}),
    priority:new google.maps.Data({map}),
    accident:new google.maps.Data({map})
  };
  layers.risk.setStyle(f=>({fillColor:colors[f.getProperty('zone')]||'#999',fillOpacity:.40,strokeColor:colors[f.getProperty('zone')]||'#999',strokeOpacity:.45,strokeWeight:.55,zIndex:1}));
  layers.priority.setStyle({icon:{path:google.maps.SymbolPath.CIRCLE,scale:5,fillColor:'#008577',fillOpacity:1,strokeColor:'#fff',strokeWeight:1.4},zIndex:4});
  layers.accident.setStyle({icon:{path:google.maps.SymbolPath.CIRCLE,scale:4,fillColor:'#111',fillOpacity:1,strokeColor:'#fff',strokeWeight:1},zIndex:6});
  const configs=[['risk','step60_google_risk.geojson'],['priority','step60_google_priority.geojson'],['accident','step60_google_accident.geojson']];
  try{
    const results=await Promise.all(configs.map(async ([name,file])=>{
      const res=await fetch(file,{cache:'no-store'});
      if(!res.ok)throw Error(file+': HTTP '+res.status);
      const data=await res.json();
      const fs=layers[name].addGeoJson(data);
      return name+': '+fs.length.toLocaleString()+'개';
    }));
    document.getElementById('status').textContent='표시 완료 — '+results.join(' / ');
  }catch(err){document.getElementById('status').textContent='자료 로딩 실패: '+err.message;console.error(err);}
  for(const name of Object.keys(layers)){
    document.getElementById(name).addEventListener('change',e=>layers[name].setMap(e.target.checked?map:null));
    layers[name].addListener('click',event=>{
      const f=event.feature;
      let msg='';
      if(name==='risk') msg='<b>격자 '+safe(f.getProperty('grid_id'))+'</b><br>상대 위험순위: '+safe(f.getProperty('zone'))+'<br>도로시설 면적비율: '+Number(f.getProperty('road_facility_pct')).toFixed(2)+'%';
      if(name==='priority'){
        msg='<b>우선조사 후보</b><br>격자: '+safe(f.getProperty('grid_id'));
        const pv=f.getProperty('pop_value');
        if(pv!==undefined && pv!==null)msg+='<br>'+safe(f.getProperty('pop_label'))+': '+Number(pv).toLocaleString()+'명';
      }
      if(name==='accident')msg='<b>2025년 지반침하 사고</b><br>사고번호: '+safe(f.getProperty('sagoNo'));
      info.setContent(msg);info.setPosition(event.latLng);info.open(map);
    });
  }
}
window.initMap=initMap;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCGQ9urdbHPNGdtaqGajRH_8LoQZp-sLb0&loading=async&callback=initMap&v=weekly&language=ko"></script>
</body></html>
